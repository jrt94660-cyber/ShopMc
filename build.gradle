plugins { id 'java' }
group = 'com.flovex'
version = '1.0.5'
java { toolchain { languageVersion = JavaLanguageVersion.of(21) } }
repositories { mavenCentral(); maven { url = 'https://repo.papermc.io/repository/maven-public/' } }
dependencies { compileOnly 'io.papermc.paper:paper-api:1.21.11-R0.1-SNAPSHOT' }
processResources { filteringCharset = 'UTF-8'; filesMatching('plugin.yml') { expand(version: project.version) } }
jar { archiveBaseName = 'ShopMc'; archiveVersion = project.version }
