name: ShopMc
version: ${version}
main: com.flovex.shopmc.ShopMc
api-version: '1.21'
folia-supported: true
author: jrt94660-cyber
description: Configurable multi-economy shop GUI recreation
softdepend: [Vault, PlayerPoints, CoinsEngine]
commands:
  shop:
    description: Open shop
    usage: /shop [category|reload]
    aliases: [smp-shop]
permissions:
  smpshop.use:
    default: true
  smpshop.admin:
    default: op
